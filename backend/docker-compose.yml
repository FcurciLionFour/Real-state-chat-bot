services:
  postgres:
    image: postgres:16-alpine
    container_name: real-state-chat-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: real_state_chat_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: real-state-chat-bot-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  python-scraper:
    build:
      context: ../python-scraper-service
    container_name: real-state-chat-bot-python-scraper
    restart: unless-stopped
    env_file:
      - ../python-scraper-service/.env.example
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
